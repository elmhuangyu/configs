name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: latest

jobs:
  test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install golangci-lint
        run: |
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin ${{ env.GOLANGCI_LINT_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Lint
        run: just lint

      - name: Build
        run: just build

      - name: Test (with race detector)
        run: go test -race -count=1 ./...

      - name: Check formatting
        run: |
          just fmt
          git diff --exit-code

      - name: Check go.mod is tidy
        run: |
          just tidy
          git diff --exit-code go.mod go.sum

  e2e-test:
    name: End-to-end test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Start docker compose services (etcd)
        run: |
          docker compose up -d etcd
          docker compose ps

      - name: Wait for etcd readiness
        run: |
          for i in {1..30}; do
            if docker compose exec -T etcd etcdctl endpoint health; then
              echo "etcd is ready"
              break
            fi
            echo "Waiting for etcd to become healthy ($i/30)..."
            sleep 1
          done
          docker compose exec -T etcd etcdctl endpoint health

      - name: Run E2E tests
        env:
          ETCD_ENDPOINT: 127.0.0.1:2379
        run: just test-e2e

      - name: Tear down docker compose services
        if: always()
        run: docker compose down -v
